<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>工作日打卡 Tracker</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Font Awesome 图标 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- PWA Theme Color -->
  <meta name="theme-color" content="#4f46e5">
  <meta name="description" content="周一至周五工作打卡与任务追踪PWA应用">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/906/906334.png">

  <!-- Inject Dynamic Web App Manifest via Data URI -->
  <script>
    const manifestJson = {
      "name": "工作日打卡 Tracker",
      "short_name": "打卡Tracker",
      "start_url": "./",
      "display": "standalone",
      "background_color": "#f3f4f6",
      "theme_color": "#4f46e5",
      "icons": [
        {
          "src": "https://cdn-icons-png.flaticon.com/512/906/906334.png",
          "sizes": "192x192",
          "type": "image/png"
        },
        {
          "src": "https://cdn-icons-png.flaticon.com/512/906/906334.png",
          "sizes": "512x512",
          "type": "image/png"
        }
      ]
    };
    const manifestStr = JSON.stringify(manifestJson);
    const manifestBlob = new Blob([manifestStr], {type: 'application/json'});
    const manifestUrl = URL.createObjectURL(manifestBlob);
    
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = manifestUrl;
    document.head.appendChild(link);
  </script>

  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    
    /* 自定义卡片勾选完成与未完成状态动画 */
    .task-card {
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    /* 未完成/初始状态: 红框/警示提示 */
    .task-card-pending {
      background-color: #ffffff;
      border: 2px solid #ef4444;
      box-shadow: 0 2px 4px rgba(239, 68, 68, 0.1);
    }
    
    /* 完成状态: 变为绿色 */
    .task-card-completed {
      background-color: #ecfdf5;
      border: 2px solid #10b981;
      box-shadow: 0 2px 4px rgba(16, 185, 129, 0.1);
    }

    /* 隐藏 Scrollbar 保持精美 */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between select-none">

  <!-- Header 顶部导航 -->
  <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-20">
    <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <i class="fa-solid me-1 fa-calendar-check text-xl text-indigo-200"></i>
        <h1 class="text-lg font-bold tracking-wide">工作日打卡 Tracker</h1>
      </div>
      <button id="pwaInstallBtn" class="hidden text-xs bg-indigo-500 hover:bg-indigo-700 px-2.5 py-1.5 rounded-full flex items-center gap-1 transition">
        <i class="fa-solid fa-download"></i> 安装应用
      </button>
    </div>
  </header>

  <!-- 主内容区 -->
  <main class="max-w-md mx-auto w-full flex-1 px-4 py-4 mb-16">
    
    <!-- 视图切换 Tabs -->
    <div class="flex bg-slate-200 p-1 rounded-xl mb-4 text-sm font-medium">
      <button id="tabWeek" class="flex-1 py-2 rounded-lg text-center transition-all bg-white text-indigo-600 shadow-sm font-semibold">
        <i class="fa-solid fa-calendar-week mr-1.5"></i>周视图打卡
      </button>
      <button id="tabMonth" class="flex-1 py-2 rounded-lg text-center transition-all text-slate-600 hover:text-slate-900">
        <i class="fa-solid fa-calendar-days mr-1.5"></i>月视图概览
      </button>
    </div>

    <!-- ==================== 周视图 (WEEK VIEW) ==================== -->
    <section id="viewWeek" class="space-y-4">
      
      <!-- 当前选择的日期 & 周滑动选择器 -->
      <div class="bg-white rounded-xl p-3 shadow-sm border border-slate-100">
        <div class="flex justify-between items-center mb-3 px-1">
          <button id="prevWeekBtn" class="p-1.5 rounded-lg text-slate-500 hover:bg-slate-100"><i class="fa-solid fa-chevron-left"></i></button>
          <span id="currentWeekRange" class="text-xs font-semibold text-slate-600">2026年10月19日 - 10月23日</span>
          <button id="nextWeekBtn" class="p-1.5 rounded-lg text-slate-500 hover:bg-slate-100"><i class="fa-solid fa-chevron-right"></i></button>
        </div>

        <!-- 周一至周五 切换 Selector -->
        <div class="grid grid-cols-5 gap-1.5" id="weekdaySelector">
          <!-- JS 动态生成 5 个工作日卡片 -->
        </div>
      </div>

      <!-- 今日进度概览条 -->
      <div class="bg-white rounded-xl p-3.5 shadow-sm border border-slate-100 flex items-center justify-between">
        <div>
          <div class="text-xs text-slate-400 font-medium">当日打卡完成度</div>
          <div class="text-lg font-bold text-slate-700" id="dayProgressText">0 / 0 (0%)</div>
        </div>
        <div class="w-24 bg-slate-100 rounded-full h-3 overflow-hidden border border-slate-200">
          <div id="dayProgressBar" class="bg-emerald-500 h-full transition-all duration-300 w-0"></div>
        </div>
      </div>

      <!-- 任务列表头部 & 新增按钮 -->
      <div class="flex justify-between items-center pt-1">
        <h2 class="text-base font-bold text-slate-800 flex items-center gap-2">
          <span id="selectedDayTitle">周一</span> 任务打卡
        </h2>
        <button id="openAddTaskModalBtn" class="text-xs bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-3 py-1.5 rounded-lg shadow-sm flex items-center gap-1 transition">
          <i class="fa-solid fa-plus"></i> 添加任务
        </button>
      </div>

      <!-- 任务卡片容器 -->
      <div id="taskListContainer" class="space-y-3">
        <!-- 动态渲染任务卡片 -->
      </div>
    </section>

    <!-- ==================== 月视图 (MONTH VIEW) ==================== -->
    <section id="viewMonth" class="hidden space-y-4">
      <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-100">
        <!-- 月份切换 -->
        <div class="flex justify-between items-center mb-4">
          <button id="prevMonthBtn" class="p-2 rounded-lg text-slate-600 hover:bg-slate-100"><i class="fa-solid fa-chevron-left"></i></button>
          <h2 id="currentMonthYearText" class="text-base font-bold text-slate-800">2026 年 10 月</h2>
          <button id="nextMonthBtn" class="p-2 rounded-lg text-slate-600 hover:bg-slate-100"><i class="fa-solid fa-chevron-right"></i></button>
        </div>

        <!-- 星期表头 -->
        <div class="grid grid-cols-7 text-center text-xs font-semibold text-slate-400 mb-2">
          <span class="text-amber-500">日</span>
          <span>一</span>
          <span>二</span>
          <span>三</span>
          <span>四</span>
          <span>五</span>
          <span class="text-amber-500">六</span>
        </div>

        <!-- 日历网格 -->
        <div id="calendarGrid" class="grid grid-cols-7 gap-1">
          <!-- 动态生成日历单元格 -->
        </div>
      </div>

      <!-- 图例说明 -->
      <div class="flex justify-center items-center space-x-4 text-xs text-slate-500 pt-1">
        <div class="flex items-center gap-1.5">
          <span class="w-3 h-3 rounded-full bg-emerald-500 border border-emerald-600 inline-block"></span>
          <span>全部完成</span>
        </div>
        <div class="flex items-center gap-1.5">
          <span class="w-3 h-3 rounded-full bg-rose-500 border border-rose-600 inline-block"></span>
          <span>未完成</span>
        </div>
        <div class="flex items-center gap-1.5">
          <span class="w-3 h-3 rounded-full bg-slate-200 border border-slate-300 inline-block"></span>
          <span>无任务/非工作日</span>
        </div>
      </div>
    </section>

  </main>

  <!-- 添加任务 弹窗 Modal -->
  <div id="addTaskModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white w-full max-w-sm rounded-2xl p-5 shadow-xl transform transition-all space-y-4">
      <div class="flex justify-between items-center border-b border-slate-100 pb-2">
        <h3 class="font-bold text-slate-800 text-base">添加工作打卡任务</h3>
        <button id="closeAddTaskModalBtn" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-500 mb-1">重复类型</label>
        <select id="newTaskType" class="w-full text-sm border border-slate-300 rounded-lg p-2.5 outline-none focus:border-indigo-500">
          <option value="weekday">每周固定打卡 (按工作日)</option>
          <option value="once">仅特定日期打卡</option>
        </select>
      </div>

      <div id="weekdaySelectGroup">
        <label class="block text-xs font-medium text-slate-500 mb-1">选择工作日</label>
        <select id="newTaskDay" class="w-full text-sm border border-slate-300 rounded-lg p-2.5 outline-none focus:border-indigo-500">
          <option value="1">周一 (Monday)</option>
          <option value="2">周二 (Tuesday)</option>
          <option value="3">周三 (Wednesday)</option>
          <option value="4">周四 (Thursday)</option>
          <option value="5">周五 (Friday)</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-500 mb-1">任务名称</label>
        <input type="text" id="newTaskNameInput" placeholder="例如：AAR简报 / 团队开会" class="w-full text-sm border border-slate-300 rounded-lg p-2.5 outline-none focus:border-indigo-500">
      </div>

      <div class="flex space-x-2 pt-2">
        <button id="cancelAddTaskBtn" class="flex-1 py-2.5 rounded-xl border border-slate-200 text-slate-600 text-sm font-medium hover:bg-slate-50">取消</button>
        <button id="confirmAddTaskBtn" class="flex-1 py-2.5 rounded-xl bg-indigo-600 text-white text-sm font-medium hover:bg-indigo-700 shadow-sm">保存任务</button>
      </div>
    </div>
  </div>

  <!-- 日历特定日期任务详情弹窗 Modal -->
  <div id="dayDetailModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white w-full max-w-sm rounded-2xl p-5 shadow-xl space-y-4">
      <div class="flex justify-between items-center border-b border-slate-100 pb-2">
        <h3 id="modalDateTitle" class="font-bold text-slate-800 text-base">2026-10-21 打卡详情</h3>
        <button id="closeDayDetailModalBtn" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      
      <div id="modalTaskList" class="space-y-2.5 max-h-60 overflow-y-auto no-scrollbar">
        <!-- 弹窗列表内容 -->
      </div>

      <div class="pt-2">
        <button id="closeModalConfirmBtn" class="w-full py-2.5 rounded-xl bg-slate-800 text-white text-sm font-medium hover:bg-slate-900">关闭</button>
      </div>
    </div>
  </div>

  <!-- 自定义 Toast 提示弹窗 (取代 alert) -->
  <div id="toast" class="fixed bottom-16 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white text-xs px-4 py-2.5 rounded-full shadow-lg transition-opacity duration-300 opacity-0 pointer-events-none z-50">
    提示信息
  </div>

  <!-- ==================== JavaScript Logic ==================== -->
  <script>
    // --- 1. 数据结构与初始配置 ---
    const STORAGE_KEY_TASKS = 'tracker_tasks_v1';
    const STORAGE_KEY_LOGS = 'tracker_logs_v1';

    // 默认内置的周一到周五任务
    const DEFAULT_TASKS = [
      { id: 'def-1', dayOfWeek: 1, name: 'CIR', type: 'weekday' },
      { id: 'def-3', dayOfWeek: 3, name: 'Supplier Approval', type: 'weekday' },
      { id: 'def-5', dayOfWeek: 5, name: 'AAR简报', type: 'weekday' }
    ];

    let tasks = [];
    let checkLogs = {}; // 格式: { "2026-10-19": { "def-1": true }, ... }

    // 全局当前选中/浏览状态
    let selectedDate = new Date(); // 当前选择的打卡日期
    let currentMonthViewDate = new Date(); // 月视图浏览的年月

    // --- 2. 初始化应用 ---
    function initApp() {
      loadData();
      
      // 如果 selectedDate 不是工作日 (周六/周日)，默认移到本周一
      const day = selectedDate.getDay();
      if (day === 0) selectedDate.setDate(selectedDate.getDate() + 1); // 变周一
      if (day === 6) selectedDate.setDate(selectedDate.getDate() + 2); // 变周一

      bindEvents();
      renderWeekView();
      renderMonthView();
      registerServiceWorker();
    }

    // 从 localStorage 加载数据
    function loadData() {
      const savedTasks = localStorage.getItem(STORAGE_KEY_TASKS);
      if (savedTasks) {
        try { tasks = JSON.parse(savedTasks); } catch(e) { tasks = DEFAULT_TASKS; }
      } else {
        tasks = [...DEFAULT_TASKS];
        saveTasks();
      }

      const savedLogs = localStorage.getItem(STORAGE_KEY_LOGS);
      if (savedLogs) {
        try { checkLogs = JSON.parse(savedLogs); } catch(e) { checkLogs = {}; }
      }
    }

    function saveTasks() {
      localStorage.setItem(STORAGE_KEY_TASKS, JSON.stringify(tasks));
    }

    function saveLogs() {
      localStorage.setItem(STORAGE_KEY_LOGS, JSON.stringify(checkLogs));
    }

    // --- 3. 日期辅助函数 ---
    function formatDateKey(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    // 获取特定日期所在周的 Monday ~ Friday
    function getWeekDays(date) {
      const curr = new Date(date);
      const day = curr.getDay(); // 0: Sun, 1: Mon, ..., 6: Sat
      // 计算到周一的偏置
      const diffToMon = curr.getDate() - day + (day === 0 ? -6 : 1);
      
      const monday = new Date(curr.setDate(diffToMon));
      const week = [];
      for (let i = 0; i < 5; i++) {
        const nextDay = new Date(monday);
        nextDay.setDate(monday.getDate() + i);
        week.push(nextDay);
      }
      return week;
    }

    // 获取某日对应的任务列表
    function getTasksForDate(dateObj) {
      const dayOfWeek = dateObj.getDay(); // 1-5
      const dateKey = formatDateKey(dateObj);

      return tasks.filter(t => {
        if (t.type === 'weekday') {
          return t.dayOfWeek === dayOfWeek;
        } else if (t.type === 'once') {
          return t.specificDate === dateKey;
        }
        return false;
      });
    }

    // --- 4. 渲染周视图 ---
    function renderWeekView() {
      const weekDays = getWeekDays(selectedDate);
      const weekdaySelector = document.getElementById('weekdaySelector');
      weekdaySelector.innerHTML = '';

      // 更新周日期区间文本
      const first = weekDays[0];
      const last = weekDays[4];
      document.getElementById('currentWeekRange').innerText = 
        `${first.getFullYear()}年${first.getMonth()+1}月${first.getDate()}日 - ${last.getMonth()+1}月${last.getDate()}日`;

      const dayNames = ['一', '二', '三', '四', '五'];

      weekDays.forEach((d, idx) => {
        const isSelected = formatDateKey(d) === formatDateKey(selectedDate);
        const dayKey = formatDateKey(d);
        const dayTasks = getTasksForDate(d);
        
        // 计算当天完成情况
        let completedCount = 0;
        dayTasks.forEach(t => {
          if (checkLogs[dayKey] && checkLogs[dayKey][t.id]) completedCount++;
        });

        const isAllDone = dayTasks.length > 0 && completedCount === dayTasks.length;
        const hasTasks = dayTasks.length > 0;

        const btn = document.createElement('button');
        btn.className = `p-2 rounded-xl flex flex-col items-center justify-center border transition-all ${
          isSelected 
            ? 'bg-indigo-600 text-white border-indigo-600 shadow-md transform scale-105' 
            : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100'
        }`;

        btn.onclick = () => {
          selectedDate = d;
          renderWeekView();
        };

        btn.innerHTML = `
          <span class="text-[10px] opacity-80 font-medium">周${dayNames[idx]}</span>
          <span class="text-sm font-bold my-0.5">${d.getDate()}</span>
          <span class="w-2 h-2 rounded-full ${
            !hasTasks ? 'bg-transparent' : (isAllDone ? 'bg-emerald-400' : 'bg-rose-500')
          }"></span>
        `;
        weekdaySelector.appendChild(btn);
      });

      // 更新标题
      const dayIndex = selectedDate.getDay();
      const cnDays = ['', '周一', '周二', '周三', '周四', '周五'];
      document.getElementById('selectedDayTitle').innerText = cnDays[dayIndex] || '工作日';

      // 渲染当天的任务列表
      renderTaskList();
    }

    // 渲染当天具体任务卡片
    function renderTaskList() {
      const container = document.getElementById('taskListContainer');
      container.innerHTML = '';

      const currentKey = formatDateKey(selectedDate);
      const dayTasks = getTasksForDate(selectedDate);

      if (dayTasks.length === 0) {
        container.innerHTML = `
          <div class="bg-white rounded-xl p-8 text-center text-slate-400 border border-dashed border-slate-200">
            <i class="fa-solid fa-clipboard-check text-3xl mb-2 text-slate-300"></i>
            <p class="text-xs">该工作日暂无预设打卡任务</p>
            <p class="text-[10px] text-slate-400 mt-1">点击右上角“添加任务”开始安排吧</p>
          </div>
        `;
        updateDayProgress(0, 0);
        return;
      }

      let completedCount = 0;

      dayTasks.forEach(task => {
        const isDone = checkLogs[currentKey] && checkLogs[currentKey][task.id];
        if (isDone) completedCount++;

        const card = document.createElement('div');
        // 未完成状态: 红色边界警示; 完成状态: 绿色背景/边框
        card.className = `task-card rounded-xl p-4 flex items-center justify-between cursor-pointer ${
          isDone ? 'task-card-completed' : 'task-card-pending'
        }`;

        card.innerHTML = `
          <div class="flex items-center space-x-3.5 flex-1 pr-2">
            <div class="w-6 h-6 rounded-lg border-2 flex items-center justify-center transition-all ${
              isDone ? 'border-emerald-500 bg-emerald-500 text-white' : 'border-rose-400 bg-rose-50 text-transparent'
            }">
              <i class="fa-solid fa-check text-xs"></i>
            </div>
            <div>
              <h4 class="font-semibold text-sm ${isDone ? 'line-through text-slate-500' : 'text-slate-800'}">${escapeHtml(task.name)}</h4>
              <span class="text-[10px] px-2 py-0.5 rounded-md font-medium ${
                isDone ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-600'
              }">
                ${isDone ? '已打卡完成' : '未打卡完成'}
              </span>
            </div>
          </div>
          <button class="delete-task-btn text-slate-300 hover:text-rose-500 p-2 transition" data-id="${task.id}" title="删除任务">
            <i class="fa-solid fa-trash-can text-sm"></i>
          </button>
        `;

        // 点击卡片打卡/取消打卡
        card.onclick = (e) => {
          if (e.target.closest('.delete-task-btn')) return; // 防止触发删除
          toggleTaskCheck(currentKey, task.id);
        };

        // 删除按钮绑定
        const delBtn = card.querySelector('.delete-task-btn');
        delBtn.onclick = (e) => {
          e.stopPropagation();
          deleteTask(task.id);
        };

        container.appendChild(card);
      });

      updateDayProgress(completedCount, dayTasks.length);
    }

    // 切换打卡勾选状态
    function toggleTaskCheck(dateKey, taskId) {
      if (!checkLogs[dateKey]) checkLogs[dateKey] = {};
      checkLogs[dateKey][taskId] = !checkLogs[dateKey][taskId];
      
      saveLogs();
      renderWeekView();
      renderMonthView(); // 同步更新月视图
      
      showToast(checkLogs[dateKey][taskId] ? "打卡成功！已标记为完成" : "已取消完成状态");
    }

    // 删除任务
    function deleteTask(taskId) {
      tasks = tasks.filter(t => t.id !== taskId);
      saveTasks();
      renderWeekView();
      renderMonthView();
      showToast("任务已成功删除");
    }

    // 更新进度条
    function updateDayProgress(completed, total) {
      const text = document.getElementById('dayProgressText');
      const bar = document.getElementById('dayProgressBar');
      
      if (total === 0) {
        text.innerText = '0 / 0 (0%)';
        bar.style.width = '0%';
        return;
      }

      const percent = Math.round((completed / total) * 100);
      text.innerText = `${completed} / ${total} (${percent}%)`;
      bar.style.width = `${percent}%`;
    }

    // --- 5. 渲染月视图 ---
    function renderMonthView() {
      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';

      const year = currentMonthViewDate.getFullYear();
      const month = currentMonthViewDate.getMonth(); // 0-11

      document.getElementById('currentMonthYearText').innerText = `${year} 年 ${month + 1} 月`;

      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);

      const startingDayIndex = firstDay.getDay(); // 0 (Sun) - 6 (Sat)
      const totalDays = lastDay.getDate();

      // 填充上一月的空格
      for (let i = 0; i < startingDayIndex; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.className = 'h-11 rounded-lg bg-slate-50/50';
        grid.appendChild(emptyCell);
      }

      // 生成当月每一天
      for (let day = 1; day <= totalDays; day++) {
        const dateObj = new Date(year, month, day);
        const dateKey = formatDateKey(dateObj);
        const dayOfWeek = dateObj.getDay();
        const isWeekend = dayOfWeek === 0 || dayOfWeek === 6;

        const dayTasks = getTasksForDate(dateObj);
        let completedCount = 0;

        dayTasks.forEach(t => {
          if (checkLogs[dateKey] && checkLogs[dateKey][t.id]) completedCount++;
        });

        const hasTasks = dayTasks.length > 0;
        const isAllDone = hasTasks && completedCount === dayTasks.length;
        const isToday = formatDateKey(new Date()) === dateKey;

        const cell = document.createElement('div');
        
        // 样式配置
        let bgStyle = 'bg-slate-50 text-slate-700 hover:bg-slate-100';
        let statusBadge = '';

        if (hasTasks) {
          if (isAllDone) {
            bgStyle = 'bg-emerald-50 text-emerald-800 border border-emerald-200';
            statusBadge = `<span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>`;
          } else {
            bgStyle = 'bg-rose-50 text-rose-800 border border-rose-200';
            statusBadge = `<span class="w-1.5 h-1.5 rounded-full bg-rose-500"></span>`;
          }
        }

        cell.className = `h-11 rounded-lg flex flex-col items-center justify-between p-1 cursor-pointer transition relative ${bgStyle} ${
          isToday ? 'ring-2 ring-indigo-500 font-bold' : ''
        }`;

        cell.innerHTML = `
          <div class="flex justify-between items-center w-full px-0.5">
            <span class="text-xs ${isWeekend ? 'text-amber-500' : ''}">${day}</span>
            ${statusBadge}
          </div>
          <div class="text-[9px] font-normal opacity-80 scale-90">
            ${hasTasks ? `${completedCount}/${dayTasks.length}` : ''}
          </div>
        `;

        cell.onclick = () => {
          openDayDetailModal(dateObj, dayTasks);
        };

        grid.appendChild(cell);
      }
    }

    // --- 6. 弹窗与交互逻辑 ---
    function bindEvents() {
      // 视图 Tab 切换
      const tabWeek = document.getElementById('tabWeek');
      const tabMonth = document.getElementById('tabMonth');
      const viewWeek = document.getElementById('viewWeek');
      const viewMonth = document.getElementById('viewMonth');

      tabWeek.onclick = () => {
        tabWeek.className = 'flex-1 py-2 rounded-lg text-center transition-all bg-white text-indigo-600 shadow-sm font-semibold';
        tabMonth.className = 'flex-1 py-2 rounded-lg text-center transition-all text-slate-600 hover:text-slate-900';
        viewWeek.classList.remove('hidden');
        viewMonth.classList.add('hidden');
      };

      tabMonth.onclick = () => {
        tabMonth.className = 'flex-1 py-2 rounded-lg text-center transition-all bg-white text-indigo-600 shadow-sm font-semibold';
        tabWeek.className = 'flex-1 py-2 rounded-lg text-center transition-all text-slate-600 hover:text-slate-900';
        viewMonth.classList.remove('hidden');
        viewWeek.classList.add('hidden');
        renderMonthView();
      };

      // 周导航
      document.getElementById('prevWeekBtn').onclick = () => {
        selectedDate.setDate(selectedDate.getDate() - 7);
        renderWeekView();
      };
      document.getElementById('nextWeekBtn').onclick = () => {
        selectedDate.setDate(selectedDate.getDate() + 7);
        renderWeekView();
      };

      // 月导航
      document.getElementById('prevMonthBtn').onclick = () => {
        currentMonthViewDate.setMonth(currentMonthViewDate.getMonth() - 1);
        renderMonthView();
      };
      document.getElementById('nextMonthBtn').onclick = () => {
        currentMonthViewDate.setMonth(currentMonthViewDate.getMonth() + 1);
        renderMonthView();
      };

      // 添加任务 Modal
      const modal = document.getElementById('addTaskModal');
      const openModalBtn = document.getElementById('openAddTaskModalBtn');
      const closeModalBtn = document.getElementById('closeAddTaskModalBtn');
      const cancelBtn = document.getElementById('cancelAddTaskBtn');
      const confirmBtn = document.getElementById('confirmAddTaskBtn');
      const taskTypeSelect = document.getElementById('newTaskType');
      const weekdayGroup = document.getElementById('weekdaySelectGroup');

      openModalBtn.onclick = () => modal.classList.remove('hidden');
      closeModalBtn.onclick = () => modal.classList.add('hidden');
      cancelBtn.onclick = () => modal.classList.add('hidden');

      taskTypeSelect.onchange = (e) => {
        if (e.target.value === 'once') {
          weekdayGroup.classList.add('hidden');
        } else {
          weekdayGroup.classList.remove('hidden');
        }
      };

      confirmBtn.onclick = () => {
        const nameInput = document.getElementById('newTaskNameInput');
        const name = nameInput.value.trim();
        if (!name) {
          showToast('请输入任务名称');
          return;
        }

        const type = taskTypeSelect.value;
        const dayOfWeek = parseInt(document.getElementById('newTaskDay').value);

        const newTask = {
          id: 'task-' + Date.now(),
          name,
          type
        };

        if (type === 'weekday') {
          newTask.dayOfWeek = dayOfWeek;
        } else {
          newTask.specificDate = formatDateKey(selectedDate);
        }

        tasks.push(newTask);
        saveTasks();
        
        nameInput.value = '';
        modal.classList.add('hidden');
        renderWeekView();
        renderMonthView();
        showToast('任务添加成功！');
      };

      // 日历详情 Modal 关闭
      document.getElementById('closeDayDetailModalBtn').onclick = () => {
        document.getElementById('dayDetailModal').classList.add('hidden');
      };
      document.getElementById('closeModalConfirmBtn').onclick = () => {
        document.getElementById('dayDetailModal').classList.add('hidden');
      };
    }

    // 打开日历某日打卡详情
    function openDayDetailModal(dateObj, dayTasks) {
      const modal = document.getElementById('dayDetailModal');
      const title = document.getElementById('modalDateTitle');
      const list = document.getElementById('modalTaskList');

      const dateKey = formatDateKey(dateObj);
      title.innerText = `${dateKey} 打卡详情`;
      list.innerHTML = '';

      if (dayTasks.length === 0) {
        list.innerHTML = '<p class="text-xs text-center text-slate-400 py-4">当日没有打卡任务</p>';
      } else {
        dayTasks.forEach(task => {
          const isDone = checkLogs[dateKey] && checkLogs[dateKey][task.id];
          const item = document.createElement('div');
          item.className = `p-3 rounded-xl flex items-center justify-between border ${
            isDone ? 'bg-emerald-50 border-emerald-200' : 'bg-rose-50 border-rose-200'
          }`;
          item.innerHTML = `
            <span class="text-xs font-semibold ${isDone ? 'text-emerald-800 line-through' : 'text-rose-800'}">${escapeHtml(task.name)}</span>
            <span class="text-[10px] px-2 py-0.5 rounded ${isDone ? 'bg-emerald-200 text-emerald-800' : 'bg-rose-200 text-rose-800'}">
              ${isDone ? '已打卡' : '未打卡'}
            </span>
          `;
          list.appendChild(item);
        });
      }

      modal.classList.remove('hidden');
    }

    // --- 7. Toast & UI 工具函数 ---
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      setTimeout(() => {
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 2000);
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, (m) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
      })[m]);
    }

    // --- 8. PWA Service Worker 注册 ---
    function registerServiceWorker() {
      if ('serviceWorker' in navigator) {
        // 使用 Inline Blob URL 创建 SW 方便单文件打包运行
        const swCode = `
          const CACHE_NAME = 'tracker-pwa-v1';
          self.addEventListener('install', (e) => {
            self.skipWaiting();
          });
          self.addEventListener('activate', (e) => {
            e.waitUntil(clients.claim());
          });
          self.addEventListener('fetch', (e) => {
            e.respondWith(
              fetch(e.request).catch(() => caches.match(e.request))
            );
          });
        `;
        const blob = new Blob([swCode], { type: 'text/javascript' });
        const swUrl = URL.createObjectURL(blob);

        navigator.serviceWorker.register(swUrl).catch(err => {
          console.log('SW registration failed:', err);
        });
      }

      // PWA 安装提示捕捉
      let deferredPrompt;
      const pwaBtn = document.getElementById('pwaInstallBtn');

      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        pwaBtn.classList.remove('hidden');
      });

      pwaBtn.addEventListener('click', () => {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          deferredPrompt.userChoice.then(() => {
            deferredPrompt = null;
            pwaBtn.classList.add('hidden');
          });
        }
      });
    }

    // 页面加载启动
    window.onload = initApp;
  </script>
</body>
</html>
